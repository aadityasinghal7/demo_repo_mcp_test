name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ensure test file exists
        run: |
          FEATURE_NAME=$(echo "${{ github.head_ref }}" | sed 's/.*\///')
          EXPECTED="tests/test_${FEATURE_NAME}.py"
          if [ ! -f "$EXPECTED" ]; then
            echo "❌ Missing required test file: $EXPECTED"
            exit 1
          fi

      - name: Run pytest
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
        env:  
            PYTHONPATH: ./src 
